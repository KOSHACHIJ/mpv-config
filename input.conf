ENTER set fullscreen yes
ESC set fullscreen no
MBTN_LEFT_DBL cycle fullscreen
MBTN_RIGHT script-binding uosc/menu
SPACE cycle pause
PLAY cycle pause
MUTE cycle mute
RIGHT seek 5
LEFT seek -5
Z add sub-delay -0.5
X add sub-delay 0.5
Meta+z add sub-delay -0.1
Meta+x add sub-delay 0.1
Meta+s screenshot
Meta+[ repeatable playlist-prev
Meta+] repeatable playlist-next
f script-binding subtitle_lines/list_subtitles
h script-binding memo-history
i script-binding stats/display-stats-toggle
l cycle-values loop-file 'inf' 'no'
m cycle mute
o show-progress
p cycle pause
q quit
s cycle sub
x set sub-delay 0
[ script_binding chapter_prev
] script_binding chapter_next
. frame-step; show-text 'frame: ${estimated-frame-number} / ${estimated-frame-count}'
, frame-back-step; show-text 'frame: ${estimated-frame-number} / ${estimated-frame-count}'
